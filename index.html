<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Radar de competencia | Perfil</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="header-main">

      <div class="logo">
        PERFIL
      </div>

      <h1>
        Radar de competencia
      </h1>

      <p id="fecha">
        Cargando análisis...
      </p>

    </div>


    <div class="header-status">

      <span class="status-dot"></span>

      Análisis actualizado

    </div>

  </header>



  <main class="container">


    <!-- =========================
         RESUMEN GENERAL
    ========================== -->

    <section
      class="stats"
      id="stats"
    >

      <div class="stat-card">

        <span>
          Temas hipercompetidos
        </span>

        <strong id="total-hiper">
          -
        </strong>

      </div>


      <div class="stat-card danger">

        <span>
          Brechas de Perfil
        </span>

        <strong id="total-brechas">
          -
        </strong>

      </div>


      <div class="stat-card warning">

        <span>
          Sin cobertura
        </span>

        <strong id="total-sin-cobertura">
          -
        </strong>

      </div>


      <div class="stat-card success">

        <span>
          Oportunidades
        </span>

        <strong id="total-oportunidades">
          -
        </strong>

      </div>

    </section>



    <!-- =========================
         PRIORIDADES DEL DÍA
    ========================== -->

    <section class="section">

      <div class="section-header">

        <div>

          <span class="eyebrow">
            QUÉ MIRAR HOY
          </span>

          <h2>
            Prioridades editoriales
          </h2>

        </div>

      </div>


      <div
        id="prioridades"
        class="prioridades-grid"
      ></div>

    </section>



    <!-- =========================
         ANÁLISIS DE TEMAS
    ========================== -->

    <section class="section">

      <div class="section-header">

        <div>

          <span class="eyebrow">
            MAPA DE COBERTURA
          </span>

          <h2>
            Análisis editorial
          </h2>

        </div>

      </div>



      <!-- =========================
           TABS
      ========================== -->

      <div class="tabs">


        <button
          class="tab active"
          data-tab="hipercompetencia"
        >

          🔥 Hipercompetencia

        </button>



        <button
          class="tab"
          data-tab="perfil_pierde"
        >

          🚨 Perfil pierde

        </button>



        <button
          class="tab"
          data-tab="sin_cobertura_perfil"
        >

          ⚠️ Sin cobertura

        </button>



        <button
          class="tab"
          data-tab="oportunidades"
        >

          💡 Oportunidades

        </button>



        <button
          class="tab"
          data-tab="discover"
        >

          📈 Audiencia

        </button>



        <button
          class="tab"
          data-tab="fortalezas_perfil"
        >

          💪 Fortalezas

        </button>


      </div>



      <!-- =========================
           CONTENIDO DINÁMICO
      ========================== -->

      <div
        id="contenido"
        aria-live="polite"
      >

        <div class="tema-card vacio">

          Cargando análisis editorial...

        </div>

      </div>


    </section>


  </main>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>


</body>

</html>
